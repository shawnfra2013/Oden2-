name: Offline chat browser acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install playwright==1.56.0 cryptography==46.0.3
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_encrypted_chat.py
