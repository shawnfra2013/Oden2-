name: Offline chat browser acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install playwright==1.56.0 cryptography==46.0.3
      - run: python tests/browser_encrypted_chat.py
        env:
          ODIN_TEST_CHROMIUM: /usr/bin/google-chrome
