name: Odin Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Odin Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail

          required=(
            ".gitignore"
            "README.md"
            "docs/architecture.md"
            "docs/controller-map.md"
          )

          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file missing: $file"
              exit 1
            fi
          done

      - name: Reject obsolete instructions in active documentation
        run: python -B scripts/check_active_docs.py

      - name: Verify canonical workflow, service registry, ports, and active paths
        run: python -B scripts/check_odin_structure.py

      - name: Install Python linter
        run: python -m pip install ruff==0.14.5

      - name: Check sync launch permissions
        run: test -x scripts/git-sync.sh && test -x services/git-sync/run

      - name: Verify hosted app release fingerprint
        run: |
          python scripts/stamp_mobile.py
          git diff --exit-code -- mobile/index.html

      - name: Stage 4 offline regression
        run: python -B -m unittest discover -s tests -p 'test*.py' -v

      - name: Stage 5 offline regression
        run: python -B -m unittest discover -s stage5 -p 'test_*.py' -v

      - name: Set up Node for dashboard tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install mobile dependencies
        run: npm ci --prefix mobile --no-audit --no-fund --ignore-scripts

      - name: Reject retired hosting in active launch paths
        shell: bash
        run: |
          set -euo pipefail
          for file in vercel.json mobile/vercel.json .vercel/project.json mobile/.vercel/project.json; do
            if [[ -e "$file" ]]; then
              echo "::error file=$file::Retired deployment configuration"
              exit 1
            fi
          done
          if git grep -inEI '([[:alnum:]-]+\.)+vercel\.app|@vercel/blob' -- \
            mobile ':!mobile/tests/**' ':!mobile/*.md' scripts services stage5 \
            ':!stage5/test*.py' README.md docs/ODIN_RUNTIME.md; then
            echo "::error::Retired hosting reference in a runtime or setup path"
            exit 1
          else
            rc=$?
            [[ "$rc" == 1 ]] || exit "$rc"
          fi

      - name: Verify documented dashboard listener
        shell: bash
        run: |
          set -euo pipefail
          endpoint=$(python - <<'PY'
          from pathlib import Path
          import re
          doc = Path("mobile/README.md").read_text()
          match = re.search(r"listens on `(127\.0\.0\.1:[0-9]+)` by default", doc)
          if not match:
              raise SystemExit("Document the dashboard's default loopback listener in mobile/README.md")
          print("http://" + match[1])
          PY
          )
          env -u ODIN_MOBILE_PORT node mobile/server.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 8 --retry-connrefused --retry-delay 1 \
            --max-time 3 "$endpoint/" -o "$RUNNER_TEMP/odin-dashboard.html"
          kill -0 "$server_pid"
          grep -Fq 'name="odin-release"' "$RUNNER_TEMP/odin-dashboard.html"
          curl --fail --silent --show-error --max-time 3 "$endpoint/api/capabilities" |
            python -c 'import json, sys; assert isinstance(json.load(sys.stdin)["access_configured"], bool)'

      - name: Verify Odin iPhone dashboard
        shell: bash
        run: |
          set -euo pipefail
          node --check mobile/app.js
          node --check mobile/api/status.js
          node --check mobile/api/session.js
          node --check mobile/api/command.js
          node --check mobile/api/chat.js
          node --check mobile/api/capabilities.js
          node --check mobile/lib/access.js
          node --check mobile/tests/status.test.js
          node --check mobile/tests/control.test.js
          node --test mobile/tests/*.test.js

      - name: Lint Python
        run: ruff check .

      - name: Check Python syntax
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(
            find . -type f -name '*.py' -not -path './.git/*' | sort
          )

          if ((${#files[@]} == 0)); then
            echo "No Python files yet."
            exit 0
          fi

          printf '%s\n' "${files[@]}"
          python -m py_compile "${files[@]}"

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(
            find . -type f -name '*.sh' -not -path './.git/*' | sort
          )

          if ((${#files[@]} == 0)); then
            echo "No shell scripts yet."
            exit 0
          fi

          printf '%s\n' "${files[@]}"

          files+=(services/*/run)
          for file in "${files[@]}"; do
            bash -n "$file"
          done

      - name: Reject obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail

          if git grep -qEI \
            '(gsk_[A-Za-z0-9_-]{20,}|csk-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|BEGIN (OPENSSH|RSA|EC|DSA) PRIVATE KEY)' \
            -- .
          then
            echo "::error::Possible secret detected in repository."
            exit 1
          else
            scan_rc=$?
            [[ "$scan_rc" == 1 ]] || exit "$scan_rc"
          fi

          echo "No obvious committed secrets detected."

      - name: Repository sanity check
        shell: bash
        run: |
          set -euo pipefail

          test ! -e .groq-key
          test ! -e .cerebras-key
          test ! -e .ai-keys.sh
          test ! -e .env

          echo "Repository sanity check passed."
