name: Offline adapter smoke test
on:
  pull_request:
    paths:
      - scripts/train_adapter.py
      - tests/adapter_smoke.py
      - .github/workflows/adapter-smoke.yml
permissions:
  contents: read
jobs:
  tiny-model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install transformers==4.57.1 peft==0.17.1
      - run: python tests/adapter_smoke.py
        env:
          HF_HUB_OFFLINE: "1"
